<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - Cybersecurity Explorer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <h1 class="glitch" data-text="Cybersecurity_Explorer"><a href="index.html" style="color: inherit; text-decoration: none;">Cybersecurity_Explorer</a></h1>
        </div>
    </header>

    <main>
        <section class="auth-section">
            <h2 class="auth-title glitch" data-text="Initiate_Session">Initiate_Session</h2>
            <form id="regForm">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-id-card"></i> Alias</label>
                    <input type="text" class="form-input" placeholder="e.g. ghost_ops" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-envelope"></i> Secure_Mail</label>
                    <input type="email" class="form-input" placeholder="operator@proton.me" required>
                </div>
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-key"></i> Passphrase</label>
                    <input type="password" class="form-input" placeholder="Minimum 12 chars" required>
                </div>
                <button type="submit" class="hero-button form-button">Generate_Profile</button>
            </form>
            <p style="margin-top: 2rem; text-align: center; font-size: 0.9rem;">
                Already Enlisted? <a href="login.html">Access_Terminal</a>
            </p>
        </section>
    </main>

    <div class="particles"></div>
    <script src="script.js"></script>
</body>
</html>
